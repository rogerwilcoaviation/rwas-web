[[migrations]]
tag = "website-response-local-admission-v1"
new_sqlite_classes = ["JerryAdmission"]

# OPENAI_API_KEY, OPENAI_PROJECT_ID, JERRY_MODEL, and JERRY_PROMPT_CACHE_RETENTION
# must be configured separately for an approved
# release. Local tests inject a synthetic provider; no credentials are committed.
[observability]
enabled = false

[observability.logs]
enabled = false
invocation_logs = false
