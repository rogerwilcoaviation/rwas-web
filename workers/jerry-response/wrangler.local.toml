# Local candidate only. No deployment or provider credential is authorized here.
name = "rwas-jerry-website-response-local-only"
main = "entry.mjs"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[[durable_objects.bindings]]
name = "JERRY_ADMISSION"
