name: Offline aircraft seller tests
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install pinned browser contract test runtime
        run: |
          npm install --prefix "${RUNNER_TEMP}/rwas-browser-runtime" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          "${RUNNER_TEMP}/rwas-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium
      # Actual local workerd SQLite/R2 and fake mail/reviewer services only.
      - run: npm run test:seller
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
      - run: node scripts/jerry-message-regression.mjs
