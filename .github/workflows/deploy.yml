name: Deploy rwas-web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/intake-bridge-deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (next-on-pages)
        run: npm run pages:build
        env:
          NODE_VERSION: '22'

      - name: Deploy production to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        id: cf-deploy-production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .vercel/output/static
            --project-name=rwas-web

      - name: Deploy preview to Cloudflare Pages
        if: github.ref != 'refs/heads/main'
        id: cf-deploy-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .vercel/output/static
            --project-name=rwas-web
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Smoke-test production (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          set -e
          echo "=== SEO smoke ==="
          for attempt in {1..12}; do
            if npm run seo:smoke; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "SEO smoke failed after edge propagation retries."
              exit 1
            fi
            echo "SEO smoke failed while the edge is propagating; retrying in 10s... ($attempt/12)"
            sleep 10
          done
          echo "=== Retail collection ==="
          for attempt in {1..12}; do
            retail_html=$(curl -fsSL https://www.rogerwilcoaviation.com/collections/avionics-certified)
            if grep -q 'Avionics Retail' <<< "$retail_html" \
              && grep -q 'g3x-touch-display-gdu-460' <<< "$retail_html" \
              && grep -q 'g5-electronic-flight-instrument-for-experimental-lsa-aircraft' <<< "$retail_html" \
              && grep -q 'For package and special pricing please contact us' <<< "$retail_html"; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Retail collection smoke failed after edge propagation retries."
              exit 1
            fi
            echo "Retail collection is still propagating; retrying in 10s... ($attempt/12)"
            sleep 10
          done
          echo "=== Garmin storefront catalog ==="
          for attempt in {1..12}; do
            if npm run catalog:production-smoke; then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Garmin storefront catalog smoke failed after edge propagation retries."
              exit 1
            fi
            echo "Garmin storefront catalog is still propagating; retrying in 10s... ($attempt/12)"
            sleep 10
          done
          echo "=== /aircraft-for-sale ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://rogerwilcoaviation.com/aircraft-for-sale
          echo "=== /aircraft-for-sale/mnvmpdlz-ng1n0 (detail page) ==="
          curl -sS -o /dev/null -w "HTTP %{http_code}\n" https://rogerwilcoaviation.com/aircraft-for-sale/mnvmpdlz-ng1n0
          echo "=== /api/chat POST (served by intake-bridge Worker) ==="
          curl -sS -X POST https://rogerwilcoaviation.com/api/chat \
            -H 'Content-Type: application/json' \
            -H 'Origin: https://rogerwilcoaviation.com' \
            -d '{"messages":[{"role":"user","content":"I want to list my aircraft"}],"listingUi":true}' \
            --max-time 30 | grep -q 'intercept/intake' || { echo "Listing-intake intercept failed"; exit 1; }
          echo "All smoke tests passed."
