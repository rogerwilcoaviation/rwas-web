name: Deploy rwas-web to Cloudflare Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/intake-bridge-deploy.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  deployments: write

jobs:
  garmin-retail-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Exact Garmin retail contracts (offline)
        run: node --test scripts/garmin-exact-retail-test.mjs

  deploy:
    runs-on: ubuntu-latest
    # Browser dependency provisioning has taken 12m40s; retain time for the
    # required seller contracts, lint, build and deployment smoke checks.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Offline durable intake and advanced routing regressions
        run: npm run test:intake

      - name: Install pinned browser contract test runtime
        run: |
          npm install --prefix "${RUNNER_TEMP}/rwas-browser-runtime" --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          "${RUNNER_TEMP}/rwas-browser-runtime/node_modules/.bin/playwright" install --with-deps chromium

      - name: Seller authentication and advanced-mode forwarding regressions
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
        run: npm run test:seller

      - name: Seller identity security and widget browser contracts
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
        run: |
          node --test tests/aircraft-sale/clerk-production-security.test.mjs
          node tests/aircraft-sale/clerk-production-browser.mjs
          node tests/aircraft-sale/clerk-widget-browser.mjs
          node --test tests/aircraft-sale/better-auth-widget-browser.mjs

      - name: Site language boundaries and advanced wrapper regressions
        run: npm run test:language

      - name: Lint
        run: npm run lint

      - name: Scoped SEO and mocked commerce regressions
        run: |
          node scripts/jerry-message-regression.mjs
          node scripts/product-snippet-eligibility-test.mjs
          node --test scripts/tests/catalog-schema-status.test.mjs
          node scripts/catalog-read-only-guard-test.mjs
          node scripts/seo-remediation-test.mjs
          node scripts/seo-technical-test.mjs
          node scripts/garmin-commercial-review-test.mjs
          node scripts/cart-private-pricing-test.mjs
          node scripts/cart-private-runtime-test.mjs
          node scripts/cart-stale-id-recovery-test.mjs
          node scripts/cart-native-refresh-test.mjs
          node scripts/cart-purchase-exceptions-test.mjs
          node scripts/papa-alpha-variant-selection-test.mjs
          node scripts/telemetry-reference-test.mjs
          node scripts/csp-stage-test.mjs
          node scripts/accessibility-remediation-test.mjs
          node --test scripts/tests/site-search.test.mjs
          node scripts/commerce-audit-regression-test.mjs

      - name: Build (next-on-pages)
        run: npm run pages:build
        env:
          NODE_VERSION: '22'
          NEXT_PUBLIC_SELLER_CLERK_PRODUCTION: 'false'
          NEXT_PUBLIC_SELLER_REPLACE_LEGACY_CATALOG: 'true'

      - name: Site-wide language persistence and responsive placement
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
        run: node tests/site-language-browser.mjs

      - name: Editorial and interface typography across exported pages and browser views
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
          TEST_EXPORT_DIR: .vercel/output/static
        run: node tests/site-typography-browser.mjs

      - name: Verify SEO build artifact and catalog payload budgets
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
        run: |
          node tests/aircraft-sale/marketplace-entry-browser.mjs
          npm run seo:artifact
          node scripts/catalog-payload-budget-test.mjs .vercel/output/static

      - name: Verify built canonical seller routing wrapper
        env:
          SELLER_PAGES_ARTIFACT_DIR: .vercel/output/static
        run: node --test --test-name-pattern='default UUID canonical routes' tests/aircraft-sale/routing.test.mjs

      - name: Exported administrator account workflow and checkbox visibility
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/rwas-browser-runtime/node_modules/playwright/index.mjs
        run: |
          node tests/aircraft-sale/account-admin-browser.mjs
          node tests/aircraft-sale/review-browser.mjs
          node tests/aircraft-sale/activity-browser.mjs

      - name: AXIS funnel smoke
        run: node scripts/axis-funnel-smoke.mjs

      - name: Deploy production to Cloudflare Pages
        if: github.ref == 'refs/heads/main'
        id: cf-deploy-production
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .vercel/output/static
            --project-name=rwas-web
            --branch=main

      - name: Deploy preview to Cloudflare Pages
        if: github.ref != 'refs/heads/main' && !startsWith(github.head_ref || github.ref_name, 'repair/aircraft-')
        id: cf-deploy-preview
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy .vercel/output/static
            --project-name=rwas-web
            --branch=${{ github.head_ref || github.ref_name }}

      - name: Read-only production smoke (push and manual)
        if: github.ref == 'refs/heads/main' && steps.cf-deploy-production.outcome == 'success'
        run: |
          for attempt in {1..6}; do
            if node scripts/production-readonly-smoke.mjs; then exit 0; fi
            if [ "$attempt" -eq 6 ]; then exit 1; fi
            sleep 10
          done

      - name: Read-only intake binding and schema evidence (not activation)
        if: steps.cf-deploy-production.outcome == 'success' || steps.cf-deploy-preview.outcome == 'success'
        run: python3 scripts/intake-production-config-audit.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
